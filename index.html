<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крутилка — Локальный стенд</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Крутилка</h1>

        <div class="input-section">
            <div class="status-bar status-open">Локальный режим: HTML + JS без бэкенда</div>

            <div class="input-group">
                <input type="text" id="authorInput" placeholder="Ник участника, например Валера">
                <input type="text" id="valueInput" placeholder="Вариант, например Шашлык">
                <button id="addBtn">Добавить</button>
            </div>

            <div class="admin-actions">
                <button id="seedBtn" class="action-btn refresh-btn">Заполнить примером</button>
                <button id="clearBtn" class="action-btn close-btn">Очистить</button>
            </div>

            <div class="contestants-list">
                <h3>Варианты:</h3>
                <ul id="contestantsList"></ul>
                <p id="emptyMsg" style="color:#999; padding:10px">Пока ничего нет.</p>
            </div>
        </div>

        <div class="wheel-section">
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
                <div class="pointer"></div>
            </div>

            <div class="spin-buttons">
                <button id="spinBtn" disabled>КРУТИТЬ</button>
                <button id="respinBtn" disabled>ЕЩЁ РАЗ</button>
            </div>

            <div id="result" class="result"></div>
        </div>
    </div>

    <script src="public/wheel.js"></script>
    <script>
        let wheel = null;

        function esc(value) {
            const div = document.createElement('div');
            div.textContent = value;
            return div.innerHTML;
        }

        function syncWheel() {
            const list = document.getElementById('contestantsList');
            const items = [...list.querySelectorAll('li[data-contestant]')];
            const emptyMsg = document.getElementById('emptyMsg');

            wheel.contestants = items.map((item) => item.dataset.contestant);
            wheel.drawWheel();
            wheel.updateButtons();
            emptyMsg.style.display = items.length ? 'none' : 'block';
        }

        function addContestant(author, value) {
            const normalizedAuthor = author.trim();
            const normalizedValue = value.trim();
            if (!normalizedAuthor || !normalizedValue) return;

            const list = document.getElementById('contestantsList');
            const li = document.createElement('li');
            const contestant = `${normalizedValue} (${normalizedAuthor})`;
            li.dataset.contestant = contestant;
            li.innerHTML = `
                <span><strong>${esc(normalizedAuthor)}</strong>: ${esc(normalizedValue)}</span>
                <span class="entry-actions">
                    <button class="remove-btn" type="button">Удалить</button>
                </span>
            `;

            li.querySelector('button').addEventListener('click', () => {
                li.remove();
                wheel.clearResult();
                syncWheel();
            });

            list.appendChild(li);
            wheel.clearResult();
            syncWheel();
        }

        function clearContestants() {
            document.getElementById('contestantsList').innerHTML = '';
            wheel.clearResult();
            syncWheel();
        }

        function seedContestants() {
            clearContestants();
            addContestant('Валера', 'Шашлык');
            addContestant('Олег', 'Пицца');
            addContestant('Маша', 'Суши');
            addContestant('Ира', 'Бургеры');
        }

        document.addEventListener('DOMContentLoaded', () => {
            wheel = new PickerWheel();

            document.getElementById('addBtn').addEventListener('click', () => {
                const authorInput = document.getElementById('authorInput');
                const valueInput = document.getElementById('valueInput');
                addContestant(authorInput.value, valueInput.value);
                authorInput.value = '';
                valueInput.value = '';
                authorInput.focus();
            });

            document.getElementById('authorInput').addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    document.getElementById('valueInput').focus();
                }
            });

            document.getElementById('valueInput').addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    document.getElementById('addBtn').click();
                }
            });

            document.getElementById('seedBtn').addEventListener('click', seedContestants);
            document.getElementById('clearBtn').addEventListener('click', clearContestants);

            seedContestants();
        });
    </script>
</body>
</html>
